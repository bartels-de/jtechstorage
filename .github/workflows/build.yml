name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jtechstorage
          # v0.43: Teil-Mods und All-in-One (ohne -sources)
          path: |
            core/build/libs/*.jar
            helpers/build/libs/*.jar
            adventure/build/libs/*.jar
            all/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
