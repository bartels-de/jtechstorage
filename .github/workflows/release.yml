name: Release

# Startet, sobald ein Versions-Tag wie v0.21.1 gepusht wird.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches mod version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match version=$VERSION in gradle.properties"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: JTechStorage ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          files: |
            all/build/libs/jtechstorage-all-${{ env.VERSION }}.jar
            core/build/libs/jtechstorage-${{ env.VERSION }}.jar
            helpers/build/libs/jtechstorage_helpers-${{ env.VERSION }}.jar
            adventure/build/libs/jtechstorage_adventure-${{ env.VERSION }}.jar
          fail_on_unmatched_files: true
