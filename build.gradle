plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		// JEI (Just Enough Items)
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jtechstorage" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Fester Name im Testclient: sonst würfelt runClient bei jedem Start einen neuen.
			// Offline hängt die UUID am Namen, damit bleiben Inventar, Fortschritte und Kosmetik erhalten.
			programArgs "--username", "Jbartels"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI: nur die API zum Kompilieren, die volle Mod nur im Testclient (runClient)
	clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	runtimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
