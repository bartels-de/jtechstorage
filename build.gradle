// v0.43: Wurzelprojekt – gemeinsame Einstellungen für alle Teil-Mods. Gebaut wird in den Unterprojekten.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = rootProject.version
	group = rootProject.group

	repositories {
		maven {
			// JEI (Just Enough Items)
			name = "BlameJared"
			url = "https://maven.blamejared.com/"
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def version = project.version
		inputs.property "version", version

		filesMatching("fabric.mod.json") {
			expand "version": version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = "UTF-8"
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		def projectName = project.name
		inputs.property "projectName", projectName
		from(rootProject.file("LICENSE")) {
			rename { "${it}_jtechstorage_$projectName" }
		}
	}
}
